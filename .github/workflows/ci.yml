name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: securevault_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d securevault_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar y comprobar backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/securevault_test
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
      - name: Instalar y compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
